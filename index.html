<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 C16 9 23 16 30 16 C23 16 16 23 16 30 C16 23 9 16 2 16 C9 16 16 9 16 2 Z' fill='%23FF7054'/%3E%3Ccircle cx='13' cy='15' r='1.5' fill='%2317271F'/%3E%3Ccircle cx='19' cy='15' r='1.5' fill='%2317271F'/%3E%3Cpath d='M14 18 Q16 20 18 18' stroke='%2317271F' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoutSpark — Find your next yes. | B2B Prospect Intelligence</title>
    <meta name="description" content="Help early-stage B2B startups identify relevant prospects, understand evidence-backed reasons for contacting them, prioritize opportunities, and generate personalized outreach drafts with human approval." />
    <!-- Editorial & Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Immediate theme hydration: default is light mode (daybreak) -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('scoutspark_theme_preference') || localStorage.getItem('scoutspark_theme');
          // Default to light mode (daybreak). Only turn dark if user explicitly chose nightops or explicitly chose system sync with dark OS.
          var isDark = pref === 'nightops' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('nightops', 'dark');
            document.documentElement.setAttribute('data-theme', 'nightops');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('nightops', 'dark');
            document.documentElement.classList.add('daybreak');
            document.documentElement.setAttribute('data-theme', 'daybreak');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F2E8] text-[#17271F] font-sans antialiased selection:bg-[#D8FF65] selection:text-[#17271F]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
